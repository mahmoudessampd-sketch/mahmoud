<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>موقعي الشخصي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#6c5ce7; --accent:#00b8b3; --bg:#f4f6fb; --card:#ffffff;
    --text:#1f2937; --muted:#6b7280; --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);line-height:1.75}
  a{color:inherit}

  /* ===== Hero ===== */
  header{
    background:linear-gradient(135deg,var(--primary) 0%,var(--accent) 100%);
    color:#fff;text-align:center;padding:64px 20px 120px;position:relative;overflow:hidden
  }
  header::before,header::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
  header::before{width:320px;height:320px;top:-120px;left:-80px}
  header::after{width:220px;height:220px;bottom:-90px;right:-60px}
  .avatar{
    width:140px;height:140px;border-radius:50%;object-fit:cover;border:5px solid #fff;
    box-shadow:0 10px 30px rgba(0,0,0,.2);background:#fff;margin:0 auto 18px;display:block;position:relative;z-index:1
  }
  .initials{display:flex;align-items:center;justify-content:center;font-size:3.5rem;font-weight:800;color:var(--primary)}
  header h1{font-size:2.5rem;font-weight:800;position:relative;z-index:1}
  .tagline{font-size:1.25rem;opacity:.95;position:relative;z-index:1}
  .contact-bar{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:22px;position:relative;z-index:1}
  .contact-bar a{
    text-decoration:none;color:#fff;background:rgba(255,255,255,.2);padding:8px 18px;border-radius:30px;
    font-size:.95rem;font-weight:500;transition:background .2s
  }
  .contact-bar a:hover{background:rgba(255,255,255,.35)}

  /* ===== Layout ===== */
  main{max-width:980px;margin:-70px auto 40px;padding:0 20px;display:grid;gap:24px;position:relative;z-index:2}
  .card{background:var(--card);border-radius:var(--radius);padding:28px;box-shadow:0 8px 24px rgba(15,23,42,.08)}
  .card h2{font-size:1.5rem;font-weight:800;margin-bottom:16px;color:var(--primary);display:flex;align-items:center;gap:10px}
  .card h2::before{content:"";width:6px;height:24px;background:var(--accent);border-radius:4px}
  .card .about{color:var(--text);font-size:1.08rem;white-space:pre-line}

  /* ===== Skills ===== */
  .skills{display:flex;flex-wrap:wrap;gap:10px}
  .skill{background:#eef0ff;color:var(--primary);padding:6px 16px;border-radius:20px;font-weight:500}

  /* ===== Projects ===== */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
  .item{border:1px solid #e5e7eb;border-radius:14px;padding:20px;transition:transform .2s,box-shadow .2s;background:#fff}
  .item:hover{transform:translateY(-4px);box-shadow:0 14px 28px rgba(0,0,0,.08)}
  .item h3{font-size:1.15rem;font-weight:700;margin-bottom:6px}
  .item p{color:var(--muted);font-size:.98rem}
  .item .link{display:inline-block;margin-top:10px;color:var(--accent);font-weight:700;text-decoration:none}
  .thumb{width:100%;height:170px;object-fit:cover;border-radius:12px;margin-bottom:14px;background:#f1f5f9;display:block}
  .logo{height:64px;max-width:200px;object-fit:contain;background:#fff;padding:6px 12px;border-radius:14px;margin:0 auto 18px;display:block;position:relative;z-index:1;box-shadow:0 6px 18px rgba(0,0,0,.15)}

  /* ===== Timeline (experience / education) ===== */
  .timeline{border-right:3px solid #e5e7eb;margin-right:8px;padding-right:22px}
  .entry{position:relative;margin-bottom:26px}
  .entry:last-child{margin-bottom:0}
  .entry::before{
    content:"";position:absolute;right:-31px;top:6px;width:14px;height:14px;border-radius:50%;
    background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 2px var(--accent)
  }
  .entry h3{font-size:1.1rem;font-weight:700}
  .entry .org{color:var(--primary);font-weight:500}
  .entry .when{color:var(--muted);font-size:.92rem}
  .entry p{color:var(--muted);margin-top:4px}

  /* ===== 3D intro ===== */
  #intro{
    position:fixed;inset:0;z-index:9999;perspective:900px;
    background:linear-gradient(135deg,var(--primary),var(--accent));
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#fff;transition:opacity .9s ease,visibility .9s ease
  }
  #intro.hide{opacity:0;visibility:hidden}
  .cube{width:130px;height:130px;position:relative;transform-style:preserve-3d;
    animation:spin 3s cubic-bezier(.6,.05,.3,1) forwards}

  footer a{color:var(--primary);text-decoration:none;font-weight:700}

  @media (max-width:600px){
    header h1{font-size:2rem}
    .card{padding:22px}
  }

<header id="hero" class="reveal"></header>

<main id="content" class="reveal"></main>

<footer id="footer" class="reveal"></footer>

<script>
  // دالة حماية لعرض النصوص بأمان
  function esc(s){
    return String(s ?? "").replace(/[&<>"']/g, c => (
      {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]
    ));
  }

  function render(){
    const d = DATA;
    document.title = d.name;

    // ----- الهيدر -----
    const contacts = [];
    if (d.contact.email)    contacts.push(`<a href="mailto:${esc(d.contact.email)}">✉ ${esc(d.contact.email)}</a>`);
    (d.contact.phones || []).forEach(p => contacts.push(`<a href="tel:${esc(p.replace(/\s/g,''))}">📞 ${esc(p)}</a>`));
    if (d.contact.whatsapp) contacts.push(`<a href="https://wa.me/${esc(d.contact.whatsapp)}" target="_blank" rel="noopener">💬 واتساب</a>`);
    if (d.contact.location) contacts.push(`<span style="padding:8px 18px">📍 ${esc(d.contact.location)}</span>`);
    d.socials.forEach(s => contacts.push(`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a>`));

    document.getElementById("hero").innerHTML = `
      ${d.logo ? `<img class="logo" src="${esc(d.logo)}" alt="شعار ${esc(d.name)}">` : ""}
      ${d.photo
        ? `<img class="avatar" src="${esc(d.photo)}" alt="${esc(d.name)}">`
        : `<div class="avatar initials">${esc(d.name.charAt(0))}</div>`}
      <h1>${esc(d.name)}</h1>
      <p class="tagline">${esc(d.tagline)}</p>
      <nav class="contact-bar">${contacts.join("")}</nav>
    `;

    // ----- المحتوى -----
    const sections = [];

    sections.push(`
      <section class="card" id="about">
        <h2>نبذة عني</h2>
        <p class="about">${esc(d.about)}</p>
      </section>`);

    sections.push(`
      <section class="card" id="skills">
        <h2>المهارات</h2>
        <div class="skills">${d.skills.map(s => `<span class="skill">${esc(s)}</span>`).join("")}</div>
      </section>`);

    sections.push(`
      <section class="card" id="projects">
        <h2>أعمالي ومشاريعي</h2>
        <div class="grid">
          ${d.projects.map(p => `
            <article class="item">
              ${p.image ? `<img class="thumb" src="${esc(p.image)}" alt="${esc(p.title)}">` : ""}
              <h3>${esc(p.title)}</h3>
              <p>${esc(p.desc)}</p>
              ${p.link ? `<a class="link" href="${esc(p.link)}" target="_blank" rel="noopener">عرض المشروع ←</a>` : ""}
            </article>`).join("")}
        </div>
      </section>`);

    sections.push(`
      <section class="card" id="experience">
        <h2>الخبرات العملية</h2>
        <div class="timeline">
          ${d.experience.map(e => `
            <div class="entry">
              <h3>${esc(e.title)}</h3>
              <div class="org">${esc(e.org)}</div>
              <div class="when">${esc(e.when)}</div>
              <p>${esc(e.desc)}</p>
            </div>`).join("")}
        </div>
      </section>`);

    sections.push(`
      <section class="card" id="education">
        <h2>المؤهلات والتعليم</h2>
        <div class="timeline">
          ${d.education.map(e => `
            <div class="entry">
              <h3>${esc(e.title)}</h3>
              <div class="org">${esc(e.org)}</div>
              <div class="when">${esc(e.when)}</div>
              <p>${esc(e.desc)}</p>
            </div>`).join("")}
        </div>
      </section>`);

    document.getElementById("content").innerHTML = sections.join("");

    // ----- الفوتر -----
    document.getElementById("footer").innerHTML = `
      © ${new Date().getFullYear()} ${esc(d.name)} — جميع الحقوق محفوظة
      ${d.contact.email ? ` · <a href="mailto:${esc(d.contact.email)}">تواصل معي</a>` : ""}
    `;
  }

  render();

  // ----- تشغيل المقدمة ثلاثية الأبعاد -----
  const intro = document.getElementById("intro");

  function reveal(){
    document.querySelectorAll(".reveal").forEach(el => el.classList.add("show"));
  }

  function playIntro(){
    if (!DATA.intro) {
      intro.remove();
      reveal();
      return;
    }
    const letter = DATA.name.charAt(0) || "✦";
    document.getElementById("intro-name").textContent = DATA.name;

    setTimeout(() => {
      intro.classList.add("hide");
      reveal();
      setTimeout(() => intro.remove(), 1000);
    }, 3200);
  }

  playIntro();

  // ----- تأثير ميلان 3D عند تحريك الفأرة على الصورة والبطاقات -----
  document.addEventListener("mousemove", e => {
    const el = e.target.closest ? e.target.closest(".item, .avatar") : null;
    if (!el) return;
    const r = el.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - 0.5;
    const y = (e.clientY - r.top) / r.height - 0.5;
    el.style.transform = `perspective(800px) rotateX(${-y * 12}deg) rotateY(${x * 12}deg) scale(1.03)`;
  });
  document.addEventListener("mouseout", e => {
    const el = e.target.closest ? e.target.closest(".item, .avatar") : null;
    if (el && !el.contains(e.relatedTarget)) el.style.transform = "";
  });
</script>
