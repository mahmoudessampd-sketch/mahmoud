<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>موقعي الشخصي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070b14;
    --glass:rgba(255,255,255,.06);
    --glass-strong:rgba(255,255,255,.1);
    --stroke:rgba(255,255,255,.12);
    --text:#eef2ff;
    --muted:#9aa4c7;
    --a1:#8b5cf6;
    --a2:#00f5d4;
    --a3:#ff4fd8;
    --radius:24px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;
    background:var(--bg);color:var(--text);line-height:1.75;overflow-x:hidden;min-height:100vh
  }
  a{color:inherit}

  /* ===== خلفية متحركة ===== */
  .bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
  .blob{position:absolute;border-radius:50%;opacity:.85;animation:float 18s ease-in-out infinite,huebg 10s linear infinite}
  @keyframes huebg{from{filter:blur(90px) hue-rotate(0deg)}to{filter:blur(90px) hue-rotate(360deg)}}
  @keyframes huerot{to{filter:hue-rotate(360deg)}}
  .b1{width:520px;height:520px;background:var(--a1);top:-160px;right:-120px}
  .b2{width:460px;height:460px;background:var(--a2);bottom:-140px;left:-120px;animation-delay:-6s}
  .b3{width:360px;height:360px;background:var(--a3);top:40%;left:40%;animation-delay:-11s;opacity:.3}
  @keyframes float{
    0%,100%{transform:translate(0,0) scale(1)}
    50%{transform:translate(40px,-30px) scale(1.08)}
  }

  /* ===== الهيدر (Hero) ===== */
  header{position:relative;text-align:center;padding:90px 20px 70px}
  .hero-inner{}
  .avatar-wrap{
    width:190px;height:190px;margin:0 auto 26px;position:relative;
    animation:bob 6s ease-in-out infinite
  }
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
  .avatar-ring{
    position:absolute;inset:-14px;border-radius:50%;
    background:conic-gradient(from 0deg,var(--a1),var(--a2),var(--a3),var(--a1));
    animation:spin 6s linear infinite,huerot 6s linear infinite;filter:blur(1px);opacity:1
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .avatar{
    width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;
    border:4px solid rgba(255,255,255,.9);box-shadow:0 30px 60px rgba(0,0,0,.5);
    position:relative;z-index:1;background:#111
  }
  .initials{display:flex;align-items:center;justify-content:center;font-size:4.5rem;font-weight:800;
    background:linear-gradient(135deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .logo{height:64px;max-width:200px;object-fit:contain;padding:8px 14px;border-radius:16px;margin:0 auto 18px;display:block;
    background:rgba(255,255,255,.95);box-shadow:0 10px 30px rgba(0,0,0,.35);position:relative;z-index:1}
  header h1{
    font-size:clamp(2.4rem,6vw,3.8rem);font-weight:800;letter-spacing:-.5px;
    background:linear-gradient(90deg,#fff,var(--a2),var(--a1),#fff);background-size:300% auto;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shine 4s linear infinite
  }
  @keyframes shine{to{background-position:300% center}}
  .tagline{font-size:1.25rem;color:var(--muted);margin-top:6px}
  .contact-bar{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:28px}
  .pill{
    text-decoration:none;color:var(--text);padding:10px 20px;border-radius:999px;font-size:.95rem;font-weight:500;
    background:var(--glass);border:1px solid var(--stroke);backdrop-filter:blur(12px);
    transition:transform .3s ease,background .3s ease,box-shadow .3s ease
  }
  .pill:hover{transform:translateY(-4px);background:var(--glass-strong);box-shadow:0 14px 30px rgba(0,0,0,.35)}
  .pill.wa{border-color:rgba(37,211,102,.5);color:#8ef0b1}
  .pill.loc{cursor:default}

  /* ===== المحتوى ===== */
  main{max-width:1040px;margin:0 auto;padding:0 20px 40px;display:grid;gap:28px}
  .card{
    position:relative;border-radius:var(--radius);padding:34px;
    background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.02));
    border:1px solid var(--stroke);backdrop-filter:blur(16px);
    box-shadow:0 20px 50px rgba(0,0,0,.35);
    transition:transform .4s ease,box-shadow .4s ease
  }
  .card h2{
    font-size:1.6rem;font-weight:800;margin-bottom:20px;display:flex;align-items:center;gap:12px
  }
  .card h2 span.dot{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 0 18px var(--a2);animation:huerot 5s linear infinite}
  .about{color:#d4dbf5;font-size:1.1rem;white-space:pre-line}

  /* ===== المهارات ===== */
  .skills{display:flex;flex-wrap:wrap;gap:12px}
  .skill{
    padding:10px 18px;border-radius:14px;font-weight:600;
    background:linear-gradient(135deg,rgba(139,92,246,.35),rgba(0,245,212,.3));border:1px solid rgba(139,92,246,.6);color:#fff;
    transition:transform .3s ease,background .4s ease
  }
  .skill:hover{transform:translateY(-4px) scale(1.05);background:linear-gradient(135deg,rgba(255,79,216,.45),rgba(0,245,212,.45));border-color:rgba(255,79,216,.7)}

  /* ===== المشاريع ===== */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
  .item{
    border-radius:20px;overflow:hidden;background:rgba(255,255,255,.05);border:1px solid var(--stroke);
    transition:transform .35s ease,box-shadow .35s ease
  }
  .item:hover{box-shadow:0 30px 60px rgba(0,0,0,.45)}
  .thumb{width:100%;height:190px;object-fit:cover;display:block;background:#0f1424}
  .item-body{padding:20px}
  .item h3{font-size:1.2rem;font-weight:700;margin-bottom:6px}
  .item p{color:var(--muted);font-size:.98rem}
  .item .link{display:inline-block;margin-top:12px;color:var(--a2);font-weight:700;text-decoration:none}

  /* ===== الخط الزمني ===== */
  .timeline{position:relative;padding-right:30px}
  .timeline::before{
    content:"";position:absolute;right:8px;top:6px;bottom:6px;width:2px;
    background:linear-gradient(var(--a1),var(--a2),transparent)
  }
  .entry{position:relative;margin-bottom:28px;padding:18px 22px;border-radius:18px;
    background:rgba(255,255,255,.04);border:1px solid var(--stroke);transition:transform .3s ease,background .3s ease}
  .entry:hover{transform:translateX(-6px);background:rgba(255,255,255,.08)}
  .entry:last-child{margin-bottom:0}
  .entry::before{
    content:"";position:absolute;right:-28px;top:26px;width:16px;height:16px;border-radius:50%;
    background:var(--a2);box-shadow:0 0 0 4px rgba(0,224,198,.2),0 0 18px var(--a2)
  }
  .entry h3{font-size:1.1rem;font-weight:700}
  .entry .org{color:#b9a8ff;font-weight:500}
  .entry .when{color:var(--muted);font-size:.9rem}
  .entry p{color:var(--muted);margin-top:6px}

  /* ===== الأقسام المدمجة (أكورديون) ===== */
  .panel{border:1px solid var(--stroke);border-radius:20px;background:rgba(255,255,255,.04);margin-bottom:16px;overflow:hidden;transition:background .3s ease}
  .panel:last-child{margin-bottom:0}
  .panel.open{background:rgba(255,255,255,.07)}
  .panel-btn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;
    padding:18px 22px;background:none;border:0;color:var(--text);font-family:inherit;font-size:1.25rem;font-weight:700;cursor:pointer;text-align:right}
  .panel-btn .ico{flex:0 0 auto;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;font-size:1.5rem;line-height:1;
    box-shadow:0 8px 20px rgba(139,92,246,.45);transition:transform .45s cubic-bezier(.2,.8,.2,1);animation:huerot 6s linear infinite}
  .panel.open .ico{transform:rotate(135deg)}
  .panel-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s ease}
  .panel.open .panel-body{grid-template-rows:1fr}
  .panel-inner{min-height:0;overflow:hidden;padding:0 22px;transition:padding .5s ease}
  .panel.open .panel-inner{padding:0 22px 24px}
  .panel-inner .timeline{padding-top:6px}

  footer{text-align:center;color:var(--muted);padding:40px 20px 50px;font-size:.92rem}
  footer a{color:var(--a2);text-decoration:none;font-weight:700}

  /* ===== المقدمة ثلاثية الأبعاد ===== */
  #intro{
    position:fixed;inset:0;z-index:9999;perspective:900px;background:var(--bg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transition:opacity .9s ease,visibility .9s ease
  }
  #intro::before{
    content:"";position:absolute;width:600px;height:600px;border-radius:50%;
    background:radial-gradient(circle,rgba(124,92,255,.35),transparent 60%);filter:blur(30px)
  }
  #intro.hide{opacity:0;visibility:hidden}
  .cube{width:150px;height:150px;position:relative;transform-style:preserve-3d;
    animation:spin3d 3.2s cubic-bezier(.6,.05,.3,1) forwards}

<script>
  function esc(s){
    return String(s ?? "").replace(/[&<>"']/g, c => (
      {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]
    ));
  }

  function card(id, title, body){
    return `
      <section class="card reveal" id="${id}" data-tilt>
        <h2><span class="dot"></span>${title}</h2>
        ${body}
      </section>`;
  }

  function render(){
    const d = DATA;
    document.title = d.name;

    // ----- الهيدر -----
    const contacts = [];
    if (d.contact.email)    contacts.push(`<a class="pill" href="mailto:${esc(d.contact.email)}">✉ ${esc(d.contact.email)}</a>`);
    (d.contact.phones || []).forEach(p => contacts.push(`<a class="pill" href="tel:${esc(p.replace(/\s/g,''))}">📞 ${esc(p)}</a>`));
    if (d.contact.whatsapp) contacts.push(`<a class="pill wa" href="https://wa.me/${esc(d.contact.whatsapp)}" target="_blank" rel="noopener">💬 واتساب</a>`);
    if (d.contact.location) contacts.push(`<span class="pill loc">📍 ${esc(d.contact.location)}</span>`);
    d.socials.forEach(s => contacts.push(`<a class="pill" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a>`));

    document.getElementById("hero").innerHTML = `
      <div class="hero-inner" id="heroInner">
        ${d.logo ? `<img class="logo" src="${esc(d.logo)}" alt="شعار ${esc(d.name)}">` : ""}
        <div class="avatar-wrap">
          <div class="avatar-ring"></div>
          ${d.photo
            ? `<img class="avatar" src="${esc(d.photo)}" alt="${esc(d.name)}">`
            : `<div class="avatar initials">${esc(d.name.charAt(0))}</div>`}
        </div>
        <h1>${esc(d.name)}</h1>
        <p class="tagline">${esc(d.tagline)}</p>
        <nav class="contact-bar">${contacts.join("")}</nav>
      </div>`;

    // ----- المحتوى -----
    const sections = [];

    sections.push(card("about", "نبذة عني",
      `<p class="about">${esc(d.about)}</p>`));

    const entriesHtml = (arr) => `
      <div class="timeline">
        ${arr.map(e => `
          <div class="entry">
            <h3>${esc(e.title)}</h3>
            ${e.org ? `<div class="org">${esc(e.org)}</div>` : ""}
            ${e.when ? `<div class="when">${esc(e.when)}</div>` : ""}
            ${e.desc ? `<p>${esc(e.desc)}</p>` : ""}
          </div>`).join("")}
      </div>`;

    const panel = (id, title, body) => `
      <div class="panel" id="${id}">
        <button class="panel-btn" type="button" aria-expanded="false">
          <span>${esc(title)}</span><span class="ico">+</span>
        </button>
        <div class="panel-body"><div class="panel-inner">${body}</div></div>
      </div>`;

    const skillsHtml = `<div class="skills">${d.skills.map(s => `<span class="skill">${esc(s)}</span>`).join("")}</div>`;

    const projectsHtml = `<div class="grid">
        ${d.projects.map(p => `
          <article class="item" data-tilt>
            ${p.image ? `<img class="thumb" src="${esc(p.image)}" alt="${esc(p.title)}">` : ""}
            <div class="item-body">
              <h3>${esc(p.title)}</h3>
              <p>${esc(p.desc)}</p>
              ${p.link ? `<a class="link" href="${esc(p.link)}" target="_blank" rel="noopener">عرض المشروع ←</a>` : ""}
            </div>
          </article>`).join("")}
      </div>`;

    sections.push(card("more", "مهاراتي وأعمالي وخبراتي",
      panel("p-skills", "المهارات", skillsHtml) +
      panel("p-projects", "أعمالي ومشاريعي", projectsHtml) +
      panel("p-exp", "الخبرات العملية", entriesHtml(d.experience)) +
      panel("p-edu", "المؤهلات والتعليم", entriesHtml(d.education))
    ));

    document.getElementById("content").innerHTML = sections.join("");

    // ----- الفوتر -----
    document.getElementById("footer").innerHTML = `
      © ${new Date().getFullYear()} ${esc(d.name)} — جميع الحقوق محفوظة
      ${d.contact.email ? ` · <a href="mailto:${esc(d.contact.email)}">تواصل معي</a>` : ""}`;
  }

  render();

  // ----- المقدمة ثلاثية الأبعاد -----
  const intro = document.getElementById("intro");

  function reveal(){
    document.querySelectorAll(".reveal").forEach((el, i) => {
      setTimeout(() => el.classList.add("show"), i * 120);
    });
  }

  function playIntro(){
    if (!DATA.intro) { intro.remove(); reveal(); return; }
    document.getElementById("intro-name").textContent = DATA.name;
    setTimeout(() => {
      intro.classList.add("hide");
      reveal();
      setTimeout(() => intro.remove(), 1000);
    }, 3600);
  }
  playIntro();

  document.addEventListener("click", e => {
    const btn = e.target.closest ? e.target.closest(".panel-btn") : null;
    if (!btn) return;
    const p = btn.closest(".panel");
    const open = p.classList.toggle("open");
    btn.setAttribute("aria-expanded", open ? "true" : "false");
  });

</script>

</body>
